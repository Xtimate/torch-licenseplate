<!doctype html>
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black_out" />
    <meta name="apple-mobile-web-app-title" content="Spotter" />
    <title>Spotter App</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500;700&display=swap"
        rel="stylesheet"
    />
    <style>
        :root {
            --bg: #0a0a0a;
            --fg: #f0ede6;
            --accent: #e8c84a;
            --mute: rgba(240, 237, 230, 0.4);
            --mute2: rgba(240, 237, 230, 0.18);
            --line: rgba(240, 237, 230, 0.08);
            --card: rgba(240, 237, 230, 0.04);
            --good: #22c55e;
            --bad: #ef4444;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: "DM Mono", monospace;
            min-height: 100dvh;
            overflow-x: hidden;
        }

        #app {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        .screen {
            display: none;
            flex: 1;
            flex-direction: column;
        }

        .screen.active {
            display: flex;
        }

        .topbar {
            padding: 16px 20px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--line);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-mark {
            width: 26px;
            height: 26px;
            border: 2px solid var(--accent);
            border-radius: 5px;
            position: relative;
        }

        .brand-mark::before {
            top: 2px;
            left: 2px;
        }
        .brand-mark::after {
            bottom: 2px;
            right: 2px;
        }

        .brand-title {
            font-family: "Syne", sans-serif;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-sub {
            font-size: 9px;
            color: var(--mute);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .history-btn {
            background: none;
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--mute);
            font-family: "DM Mono", monospace;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 6px 12px;
            cursor: pointer;
        }

        .hero {
            padding: 40px 20px 32px;
            text-align: center;
        }

        .hero-eyebrow {
            font-size: 9px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .hero-title {
            font-family: "Syne", sans-serif;
            font-size: 52px;
            font-weight: 800;
            letter-spacing: -2px;
            line-height: 1;
        }

        .hero-title.span {
            margin-top: 12px;
            font-size: 11px;
            color: var(--mute);
            line-height: 1.6;
        }

        .mode-cards {
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        .mode-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 22px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .mode-card:active {
            opacity: 0.7;
        }

        .mode-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: rgba(232, 200, 74, 0.1);
            border: 1px solid rgba(232, 200, 74, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .mode-info {
            flex: 1;
        }

        .mode-label {
            font-family: "Syne", sans-serif;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .mode-hint {
            font-size: 10px;
            color: var(--mute);
        }

        .mode-arrow {
            color: var(--accent);
            font-size: 20px;
        }

        .status-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 20px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: var(--good);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .dot.red {
            background: var(--bad);
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        .status-text {
            font-size: 10px;
            color: var(--mute);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .scan-header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--line);
            flex-shrink: 0;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 24px;
            cursor: pointer;
            line-height: 1;
            padding: 4px;
        }

        .scan-title {
            font-family: "Syne", sans-serif;
            font-size: 16px;
            font-weight: 700;
        }

        .camera-area {
            position: relative;
            background: #000;
            flex: 1;
            overflow: hidden;
            max-height: 55dvh;
        }

        #scan-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #scan-canvas {
            display: none;
        }

        .camera-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .finder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75%;
            height: 30%;
        }

        .finder-corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: var(--accent);
            border-style: solid;
            opacity: 0.8;
        }

        .finder-corner.tl {
            top: 0;
            left: 0;
            border-width: 2px 0 0 2px;
        }
        .finder-corner.tr {
            top: 0;
            right: 0;
            border-width: 2px 2px 0 0;
        }
        .finder-corner.bl {
            bottom: 0;
            left: 0;
            border-width: 0 0 2px 2px;
        }
        .finder-corner.br {
            bottom: 0;
            right: 0;
            border-width: 0 2px 2px 0;
        }

        .scan-hint {
            postion: absolute;
            bottom: 16px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .scan-controls {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
        }

        .scan-result {
            background: var(--card);
            border: 10px solid var(--line);
            border-radius: var(--radius);
            padding: 16px;
            display: none;
        }

        .scan-result.visible {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .capture-btn {
            width: 100%;
            padding: 18px;
            background: var(--accent);
            color: #0a0a0a;
            border: none;
            border-radius: var(--radius);
            font-family: "Syne", sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .capture-btn:active {
            opacity: 0.8;
        }

        .capture-btn:disabled {
            opacity: 0.4;
        }

        .live-video-area {
            position: relative;
            background: #000;
            height: 45dvh;
            overflow: hidden;
            flex-shrink: 0;
        }

        #live-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #live-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .live-hud {
            position: absolute;
            inset: 0;
            pointer-events: none;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .hud-pill {
            background: rgba(0,0,0,0,0.7);
            border: 1px solid rgba(232,200,74,0.3);
            border-radius: 20px;
            padding: 4px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            color: var(--accent);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .hud-count {
            background: rgba(0,0,0,0.7);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 10px;
            color: var(--mute);
            letter-spacing: 1px;
        }

        .live-log {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .live-empty {
            text-align: center;
            padding: 32px 0;
            font-size: 11px;
            color: var(--mute2);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .log-entry {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            bacground: var(--card);
            border-left: 2px solid var(--accent);
            border-radius: 6px;
            animation: slideIn 0.2s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .log-entry-text {
            font-size: 14px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 1px;
            flex: 1;
        }

        .live-controls {
            padding: 16px;
            border-top: 1px soldid var(--line);
            flex-shrink: 0;
        }

        .live-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: var(--radius);
            font-family: 'Syne', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
        }

        .live-btn.start {
            background: var(--accent); color: #0a0a0a;
        }

        .live-btn.stop {
            background: rgba(239,68,68,0.12);
            color: var(--bad);
            border: 1px solid rgba(239,68,68,0.3);
        }

        .live-btn.active {
            opacity: 0.8;
        }

    </style>
</head>
<body>
    <div id="app">
        <div id="home" class="screen active">
            <div class="topbar">
                <div class="brand">
                    <div class="brand-mark"></div>
                    <div>
                        <div class="brand-title">Spotter</div>
                        <div class="brand-sub">ALPR · Mobile</div>
                    </div>
                </div>
                <button class="history-btn" onclick="showScreen('history')">
                    History
                </button>
            </div>
            <div class="hero">
                <div class="hero-eyebrow">License Plate Recognition</div>
                <div class="hero-title">Spot<span>.</span></div>
                <div class="hero-sub">
                    Point your camera at a plate.<br />Get the text instantly.
                </div>
            </div>

            <div class="mode-cards">
                <div class="mode-card" onclick="startScan()">
                    <div class="mode-icon">📷</div>
                    <div class="mode-info">
                        <div class="mode-label">Scan</div>
                        <div class="mode-hint">
                            Single shot · tap to capture
                        </div>
                    </div>
                    <div class="mode-arrow">›</div>
                </div>

                <div class="mode-card" onlick="showScreen('live')">
                    <div class="mode-icon">📡</div>
                    <div class="mode-info">
                        <div class="mode-label">Live</div>
                        <div class="mode-hint">
                            Stream frames · real-time detection
                        </div>
                    </div>
                    <div class="mode-arrow">›</div>
                </div>
            </div>

            <div class="status-row">
                <div class="dot" id="api-dot"></div>
                <span class="status-text" id="api-status">Checking API...</span>
            </div>
        </div>

        <div id="scan" class="screen">
            <div class="scan-header">
                <button class="back-btn" onclick="stopScan()">‹</button>
                <div class="scan-title">Scan Plate</div>
            </div>

            <div class="camera-area">
                <video id="scan-video" autoplay playsinline muted></video>
                <canvas id="scan-canvas"></canvas>
                <div class="camera-overlay">
                    <div class="finder">
                        <div class="finder-corner tl"></div>
                        <div class="finder-corner tr"></div>
                        <div class="finder-corner bl"></div>
                        <div class="finder-corner br"></div>
                    </div>
                    <div class="scan-hint">Align plate within brackets</div>
                </div>
            </div>

            <div class="scan-controls">
                <div class="scan-result" id="scan-result"></div>
                <button
                    class="capture-btn"
                    id="capture-btn"
                    onclick="captureAndRecognize()"
                >
                    Capture
                </button>
                <button
                    onclick="testWithFile()"
                    style="
                        background: none;
                        border: 1px solid var(--line);
                        color: var(--mute);
                        padding: 10px;
                        border-radius: 8px;
                        width: 100%;
                        font-family: &quot;DM Mono&quot;, monospace;
                        font-size: 11px;
                        cursor: pointer;
                    "
                >
                    Test with file
                </button>
            </div>
        </div>
        <div id="live" class="screen">
            <div class="scan-header">
                <button class="back-btn" onclick="stopLive()"</button>
                <div class="scan-title">Live Stream</div>
            </div>

            <div class="live-video-area">
                <video id="live-video" autoplay playsinline muted></video>
                <canvas id="live-canvas"></canvas>
                <div class="live-hud">
                    <div class="hud-pill">
                        <div class="dot red" id="live-dot" style="display:none"></div>
                        <span id="live-status">Offline</span>
                    </div>
                    <div class="hud-count">
                        <span id="live-count">0</span>
                        spotted </div>
                </div>
            </div>

            <div class="live-log" id="live-log">
                <div class="live-empty">Start streaming to detect plates...</div>
            </div>

            <div class="live-controls">
                <button class="live-btn start" id="live-btn" onclick="toggleLive()">Start streaming</button>
            </div>
        </div>
        <div id="history" class="screen"></div>
    </div>

    <script>
        const API = "https://api.xtimate.tech";

        function showScreen(id) {
            document.querySelectorAll(".screen").forEach((s) => {
                s.classList.remove("active");
            });
            document.getElementById(id).classList.add("active");
        }

        async function checkApi() {
            try {
                const res = await fetch(`${API}/health`, {
                    signal: AbortSignal.timeout(4000),
                });
                const data = await res.json();
                console.log(data);
                const ok = data.status === "ok";
                document.getElementById("api-dot").className =
                    "dot" + (ok ? "" : " red");
                document.getElementById("api-status").textContent = ok
                    ? "API · Online"
                    : "API · Degraded";
            } catch {
                document.getElementById("api-dot").className = "dot red";
                document.getElementById("api-status").textContent =
                    "API · Offline";
            }
        }

        checkApi();
        setInterval(checkApi, 30000);

        let scanStream = null;

        async function startScan() {
            showScreen("scan");
            document.getElementById("scan-result").classList.remove("visible");
            try {
                scanStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" },
                    width: { ideal: 1280 },
                    height: { ideal: 720 },
                });
                document.getElementById("scan-video").srcObject = scanStream;
            } catch {
                alert("Camera access denied");
                showScreen("home");
            }
        }

        function stopScan() {
            if (scanStream) {
                scanStream.getTracks().forEach((t) => t.stop());
                scanStream = null;
            }
        }

        async function captureAndRecognize() {
            const video = document.getElementById("scan-video");
            const canvas = document.getElementById("scan-canvas");
            const btn = document.getElementById("capture-btn");

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext("2d").drawImage(video, 0, 0);

            btn.disabled = true;
            btn.textContent = "Processing...";

            canvas.toBlob(
                async (blob) => {
                    try {
                        const form = new FormData();
                        form.append("file", blob, "capture.jpg");
                        const res = await fetch(`${API}/pipeline`, {
                            method: "POST",
                            body: form,
                        });
                        const data = await res.json();

                        if (!Array.isArray(data) || data.length === 0) {
                            alert("No plates detected");
                            return;
                        }

                        showScanResult(data[0]);
                    } catch (e) {
                        alert("Request failed");
                    } finally {
                        btn.disabled = false;
                        btn.textContent = "Capture again";
                    }
                },
                "image/jpeg",
                0.85,
            );
        }

        function showScanResult(data) {
            const el = document.getElementById("scan-result");
            el.innerHTML = `
                  <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
                      <div style="font-family:'Syne',sans-serif; font-size:24px; font-weight:800; color:var(--accent); letter-spacing:2px;">
                          ${data.text}
                      </div>
                      <div style="display:flex; flex-direction:column; gap:4px;">
                          <span style="font-size:10px; color:var(--mute);">
                              ${Math.round(data.confidence * 100)}% confidence
                          </span>
                          <span style="font-size:10px; color:${data.valid_format ? "var(--good)" : "var(--bad)"};">
                              ${data.valid_format ? "✓ Valid format" : "✗ Invalid format"}
                          </span>
                      </div>
                  </div>
                  <div style="height:3px; background:var(--line); border-radius:2px;">
                      <div style="height:100%; width:${data.confidence * 100}%; background:var(--accent); border-radius:2px;"></div>
                  </div>
              `;
            el.classList.add("visible");
        }

        function testWithFile() {
            const input = document.createElement("input");
            input.type = "file";
            input.accept = "image/*";
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const btn = document.getElementById("capture-btn");
                btn.disabled = true;
                btn.textContent = "Processing...";
                try {
                    const form = new FormData();
                    form.append("file", file, "plate.jpg");
                    const res = await fetch(`${API}/pipeline`, {
                        method: "POST",
                        body: form,
                    });
                    const data = await res.json();
                    console.log(data);
                    if (!Array.isArray(data) || data.length === 0) {
                        alert("No plates detected");
                        return;
                    }
                    console.log(data[0]);
                    showScanResult(data[0]);
                } catch (e) {
                    alert("Request failed: " + e.message);
                } finally {
                    btn.disabled = false;
                    btn.textContent = "Capture again";
                }
            };
            input.click();
        }

        let liveStream = null;
        let liveWs = null;
        let liveInterval = null;
        let liveActive = false;
        let liveResults = [];

        function toggleLive() {
          if (liveActive) stopLive(); else startLive();
        }

        async funtion startLive() {

        }
    </script>
</body>
